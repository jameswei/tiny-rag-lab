[project]
name = "tiny-rag-lab"
version = "1.0.1"
description = "A learning-first RAG engine and laboratory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "rank-bm25",
    "sentence-transformers",
    "datasets",
    "openai",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
rag = "tiny_rag_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
tiktoken = ["tiktoken"]
qdrant = ["qdrant-client>=1.12"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
