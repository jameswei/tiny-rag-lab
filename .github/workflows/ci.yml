name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Check lockfile
        run: uv lock --check
      - name: Create test environment
        run: uv venv --python 3.12
      - name: Install CPU-only test dependencies
        run: >-
          uv pip install
          --index https://download.pytorch.org/whl/cpu
          --default-index https://pypi.org/simple
          --index-strategy unsafe-best-match
          'torch==2.7.1+cpu'
          '.[qdrant]'
          'pytest>=8.0'
      - name: Run Python tests
        run: uv run --no-sync pytest --tb=short -q

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production app
        run: npm run build

  guides:
    name: Learning Guides build and links
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning_materials
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: learning_materials/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build guides and validate links
        run: npm run build
